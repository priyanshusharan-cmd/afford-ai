<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="AffordAI pipeline: DataLoader, AIParser, StateBuilder, Simulator, DecisionEngine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04110C"/><stop offset="1" stop-color="#0A2219"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#34D399" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1220" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity=".1"/><stop offset=".5" stop-color="#34D399" stop-opacity=".45"/><stop offset="1" stop-color="#FBBF24" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="330" rx="22" fill="url(#grid)"/>
  
  <g>
    <rect x="60" y="54" width="200" height="160" rx="14" fill="#0B1F18" stroke="#14513C"/>
    <rect x="60" y="54" width="200" height="160" rx="14" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0200;0.1800;0.2000;1"/>
    </rect>
    <text x="80" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1" fill="#FBBF24">01</text>
    <text x="80" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#ECFDF5">DataLoader</text>
    <text x="80" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">Profiles, events, FX</text>
    <text x="80" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">rates, offers &amp; requests</text>
  </g>
  <path d="M266 134.0H294" stroke="#34D399" stroke-width="2" stroke-dasharray="4 5" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur=".9s" repeatCount="indefinite"/>
  </path>
  <path d="M288 129.0l6 5-6 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <g>
    <rect x="300" y="54" width="200" height="160" rx="14" fill="#0B1F18" stroke="#14513C"/>
    <rect x="300" y="54" width="200" height="160" rx="14" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.1990;0.2200;0.3800;0.4000;1"/>
    </rect>
    <text x="320" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1" fill="#FBBF24">02</text>
    <text x="320" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#ECFDF5">AIParser</text>
    <text x="320" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">Reads images &amp; messages,</text>
    <text x="320" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">regex fallback offline</text>
  </g>
  <path d="M506 134.0H534" stroke="#34D399" stroke-width="2" stroke-dasharray="4 5" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur=".9s" repeatCount="indefinite"/>
  </path>
  <path d="M528 129.0l6 5-6 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <g>
    <rect x="540" y="54" width="200" height="160" rx="14" fill="#0B1F18" stroke="#14513C"/>
    <rect x="540" y="54" width="200" height="160" rx="14" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.3990;0.4200;0.5800;0.6000;1"/>
    </rect>
    <text x="560" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1" fill="#FBBF24">03</text>
    <text x="560" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#ECFDF5">StateBuilder</text>
    <text x="560" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">Rebuilds today's balance,</text>
    <text x="560" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">finds rent &amp; salary</text>
  </g>
  <path d="M746 134.0H774" stroke="#34D399" stroke-width="2" stroke-dasharray="4 5" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur=".9s" repeatCount="indefinite"/>
  </path>
  <path d="M768 129.0l6 5-6 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <g>
    <rect x="780" y="54" width="200" height="160" rx="14" fill="#0B1F18" stroke="#14513C"/>
    <rect x="780" y="54" width="200" height="160" rx="14" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.5990;0.6200;0.7800;0.8000;1"/>
    </rect>
    <text x="800" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1" fill="#FBBF24">04</text>
    <text x="800" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#ECFDF5">Simulator</text>
    <text x="800" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">90-day forecast + binary</text>
    <text x="800" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">search for the safe amount</text>
  </g>
  <path d="M986 134.0H1014" stroke="#34D399" stroke-width="2" stroke-dasharray="4 5" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur=".9s" repeatCount="indefinite"/>
  </path>
  <path d="M1008 129.0l6 5-6 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <g>
    <rect x="1020" y="54" width="200" height="160" rx="14" fill="#0B1F18" stroke="#14513C"/>
    <rect x="1020" y="54" width="200" height="160" rx="14" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.7990;0.8200;0.9800;1.0000;1"/>
    </rect>
    <text x="1040" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1" fill="#FBBF24">05</text>
    <text x="1040" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#ECFDF5">DecisionEngine</text>
    <text x="1040" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA89E">Ranks every safe plan,</text>
