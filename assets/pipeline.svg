  </g>
  <path d="M60 268H1220" stroke="url(#track)" stroke-width="2"/>
  <circle cy="268" r="6" fill="#ECFDF5" stroke="#34D399" stroke-width="3">
    <animate attributeName="cx" values="60;1220" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4B6B5E">
    <text x="60" y="298">csv · png · messages</text>
    <text x="1220" y="298" text-anchor="end" fill="#FBBF24">→ verdict + payment plan</text>
  </g>
