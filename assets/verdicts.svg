<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Verdicts across 251 requests: 81 affordable now, 70 with a plan, 45 later, 55 not affordable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04110C"/><stop offset="1" stop-color="#0A2219"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#34D399" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient></defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <text x="60" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2" fill="#6EE7B7">VERDICTS ON THE 251 EVALUATION REQUESTS</text>
  <text x="1220" y="44" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1" fill="#4B6B5E">dataset/requests.csv → output.csv</text>
  
  <text x="60" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ECFDF5">affordable_now</text>
  <text x="60" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FA89E">full_payment today</text>
  <rect x="400" y="72" width="700" height="26" rx="13" fill="#34D399" fill-opacity=".07"/>
  <rect x="400" y="72" width="0" height="26" rx="13" fill="#34D399">
    <animate attributeName="width" values="0;700;700;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.0s" repeatCount="indefinite"
      calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.6 0 .8 .2" fill="freeze"/>
  </rect>
  <text x="1130" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#34D399">81</text>
  <text x="1180" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4B6B5E">32%</text>
  <text x="60" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ECFDF5">affordable_with_plan</text>
  <text x="60" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FA89E">installments 63 · partial 7</text>
  <rect x="400" y="138" width="700" height="26" rx="13" fill="#2DD4BF" fill-opacity=".07"/>
  <rect x="400" y="138" width="0" height="26" rx="13" fill="#2DD4BF">
    <animate attributeName="width" values="0;605;605;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.15s" repeatCount="indefinite"
      calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.6 0 .8 .2" fill="freeze"/>
  </rect>
  <text x="1130" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#2DD4BF">70</text>
  <text x="1180" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4B6B5E">28%</text>
  <text x="60" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ECFDF5">affordable_later</text>
  <text x="60" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FA89E">wait for a safe date</text>
  <rect x="400" y="204" width="700" height="26" rx="13" fill="#FBBF24" fill-opacity=".07"/>
  <rect x="400" y="204" width="0" height="26" rx="13" fill="#FBBF24">
    <animate attributeName="width" values="0;389;389;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.3s" repeatCount="indefinite"
      calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.6 0 .8 .2" fill="freeze"/>
  </rect>
  <text x="1130" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FBBF24">45</text>
  <text x="1180" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4B6B5E">18%</text>
  <text x="60" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ECFDF5">not_affordable</text>
  <text x="60" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FA89E">not_recommended</text>
  <rect x="400" y="270" width="700" height="26" rx="13" fill="#FB7185" fill-opacity=".07"/>
  <rect x="400" y="270" width="0" height="26" rx="13" fill="#FB7185">
    <animate attributeName="width" values="0;475;475;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.44999999999999996s" repeatCount="indefinite"
      calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.6 0 .8 .2" fill="freeze"/>
  </rect>
  <text x="1130" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FB7185">55</text>
  <text x="1180" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4B6B5E">22%</text>
</svg>
